<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ван-Шот — Игрок</title>
<link rel="preload" href="assets/fonts/ibm-plex-sans-cyrillic-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/ibm-plex-sans-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/controls.css">
<link rel="stylesheet" href="css/style.css">
<!--GAME_BOOT-->
<script src="js/game.js"></script>
<script src="js/uiscale.js"></script>
</head>
<body>

  <!-- Снежный фон окна входа (public/js/loginfx.js); при входе игрока гасится -->
  <div class="login-bg" id="login-bg" aria-hidden="true"><canvas id="login-bg-canvas"></canvas></div>

  <div id="join-form" class="card join-card">
    <div id="join-form-vue-root"></div>
  </div>

  <div id="app" class="map-stage hidden">
    <div class="map-scroll">
      <canvas id="map-canvas"></canvas>
    </div>

    <!-- Погода (холод/ветер/метель): над картой, с вырезом под картинки; клики пропускает (public/js/weather.js) -->
    <canvas class="weather-layer" id="weather-canvas" aria-hidden="true"></canvas>

    <!-- Блок «ресурсы»: FPS и прочее (public/js/perfhud.js); выключается в «Вид» -->
    <div class="perf-hud" id="perf-hud" aria-hidden="true"></div>

    <!-- Сверху по центру: текущая локация и (только в бою) полоса «Раунд/Ход» -->
    <div class="hud-top">
      <div id="location-badge-vue-root"></div>
      <div id="combat-strip-vue-root"></div>
      <!-- Плавающая кнопка «К герою»: только когда фишки героя не видно на экране (src/player-panel/HeroButton.vue) -->
      <div id="hero-btn-vue-root"></div>
    </div>

    <!-- Отряд: компактная карточка справа сверху (сворачивается) -->
    <div class="party-root" id="party-panel-vue-root"></div>

    <!-- Блоки левой панели (public/js/dock.js): открыт максимум один, шапку добавляет Dock.
         Vue-панели всегда смонтированы — скрывает их только CSS. -->
    <div class="dock-block" id="character-panel">
      <div class="dock-scroll">
        <div id="sheet-drawer-vue-root"></div>
        <div id="skills-drawer-vue-root"></div>
      </div>
    </div>

    <div class="dock-block" id="drawing-panel">
      <div id="drawing-panel-vue-root"></div>
    </div>

    <div class="dock-block" id="effects-panel">
      <div id="effects-panel-vue-root"></div>
    </div>

    <div class="dock-block" id="ruler-panel">
      <div id="ruler-panel-vue-root"></div>
    </div>

    <!-- Мои картинки: игрок правит свои принятые ГМ картинки; пока блок открыт, режим правки включён -->
    <div class="dock-block" id="images-panel">
      <div id="images-panel-vue-root"></div>
    </div>

    <!-- Вид: масштаб интерфейса (public/js/uiscale.js), личная настройка устройства -->
    <div class="dock-block" id="view-panel">
      <div id="view-panel-vue-root"></div>
    </div>

    <div class="dock-block" id="sound-panel">
      <div class="panel-tabs dock-tabs">
        <button type="button" class="panel-tab active" data-tab="soundboard"><i data-icon="volume-2"></i><span class="tab-label">Саундборд</span></button>
        <button type="button" class="panel-tab" data-tab="music"><i data-icon="music"></i><span class="tab-label">Музыка</span></button>
      </div>
      <div class="dock-pane active" data-pane="soundboard">
        <div id="soundboard-panel-vue-root"></div>
      </div>
      <div class="dock-pane" data-pane="music">
        <div id="music-panel-vue-root"></div>
      </div>
    </div>

    <!-- Кубики бросков: каждый бросок — свой d20, несколько одновременно (public/js/diceFx.js) -->
    <div class="dfx-layer" id="dice-layer"></div>

    <!-- Окно показа роликов: открывает сервер по команде ГМ, у игрока только смотреть (public/js/videofx.js) -->
    <div class="video-layer" id="video-layer"></div>

    <div class="combat-start-overlay" id="combat-start-overlay"></div>

    <!-- Приветствие сцены (public/js/scenefx.js); внутри #app — до входа скрыто -->
    <div class="scene-intro-overlay" id="scene-intro-overlay" role="dialog" aria-modal="true"></div>

    <!-- Журнал: чат + броски (public/js/journal.js) -->
    <div class="journal-peek" id="journal-peek" aria-live="polite"></div>
    <div class="journal" id="journal-panel">
      <div class="dock-head">
        <span class="dock-title">Журнал</span>
        <button type="button" class="dock-close" title="Закрыть (Esc)" aria-label="Закрыть"><i data-icon="x"></i></button>
      </div>
      <div class="panel-tabs dock-tabs">
        <button type="button" class="panel-tab active" data-tab="chat"><i data-icon="message-square"></i><span class="tab-label">Чат</span></button>
        <button type="button" class="panel-tab" data-tab="dice"><i data-icon="dices"></i><span class="tab-label">Броски</span></button>
      </div>
      <div class="dock-pane active" data-pane="chat">
        <div id="chat-panel-vue-root"></div>
      </div>
      <div class="dock-pane" data-pane="dice">
        <div id="dicelog-panel-vue-root"></div>
      </div>
    </div>
    <button type="button" class="journal-btn" id="journal-btn" title="Журнал: чат и броски" aria-label="Журнал: чат и броски" aria-pressed="false">
      <i data-icon="message-square"></i><span class="journal-badge" id="journal-badge" hidden></span>
    </button>

    <!-- Нижняя панель: броски атрибутов -->
    <div class="action-bar" id="action-rail-vue-root"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="js/icons-data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/tooltip.js"></script>
  <script src="js/loginfx.js"></script>
  <script src="js/perfhud.js"></script>
  <script src="js/audiounlock.js"></script>
  <script src="js/fogfx.js"></script>
  <script src="js/map.js"></script>
  <script src="js/dice.js"></script>
  <script src="js/combatfx.js"></script>
  <script src="js/imagetools.js"></script>
  <script src="js/diceFx.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/scenefx.js"></script>
  <script src="js/videofx.js"></script>
  <script src="js/soundboard.js"></script>
  <script src="js/music.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/dock.js"></script>
  <script src="js/journal.js"></script>
  <script src="js/player.js"></script>
  <script src="dist/player-panel.js"></script>
</body>
</html>
